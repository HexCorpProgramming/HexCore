name: Release

on:
  push:
    branches:
      - 'Mxtress'

jobs:
  build:
    name: Build project and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Restore BuildTools Git repos
        uses: actions/cache@v4
        with:
          path: |
            .spigot-buildtools/BuildData
            .spigot-buildtools/Spigot
            .spigot-buildtools/Bukkit
            .spigot-buildtools/CraftBukkit
          key: ${{ runner.os }}-buildtools-${{ hashFiles('.spigot-buildtools/BuildTools.jar') }}
          restore-keys: |
            ${{ runner.os }}-buildtools-
      - name: Run Spigot-BuildTools
        run: |
          mkdir -p .spigot-buildtools
          cd .spigot-buildtools
          wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar -O BuildTools.jar
          java -jar BuildTools.jar --rev 1.21.5 --remapped
      - name: Cache BuildTools Git repos
        uses: actions/cache@v4
        with:
          path: |
            .spigot-buildtools/BuildData
            .spigot-buildtools/Spigot
            .spigot-buildtools/Bukkit
            .spigot-buildtools/CraftBukkit
          key: ${{ runner.os }}-buildtools-${{ hashFiles('.spigot-buildtools/BuildTools.jar') }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump_version
        run: |
          version="${{ steps.get_tag.outputs.tag }}"
          version="${version#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_tag="v$major.$minor.$patch"
          echo "Bumped to $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean package
      - name: Find main plugin JAR
        id: find_jar
        run: |
          file=$(find target -maxdepth 1 -name "*-SNAPSHOT.jar" ! -name "*remapped*" ! -name "*original*" | head -n 1)
          echo "Found main JAR: $file"
          echo "file=$file" >> $GITHUB_OUTPUT
      - name: Upload release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          files: ${{ steps.find_jar.outputs.file }}
