name: Release

on:
  push:
    branches:
      - 'Mxtress'

jobs:
  release:
    name: Publish a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Run Spigot-BuildTools
        if: steps.spigot.outputs.cache-hit != true
        run: |
            mkdir -p .spigot-buildtools
             cd .spigot-buildtools
             wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar -O BuildTools.jar
             java -jar BuildTools.jar --rev 1.21.5
             cd ..
             rm -R .spigot-buildtools
        env:
            SPIGOT_M2: ~/.m2/repository/org/spigotmc/spigot
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean package
      - name: Get Version from POM
        run: echo "::set-output name=version::$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec)"
        id: version
      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        with:
          draft: false
          prerelease: false
          release_name: ${{ github.ref }}
          tag_name: ${{ github.ref }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload Java File
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "target/HexCore-${{ steps.version.outputs.version }}.jar"
          asset_name: HexCore-${{ steps.version.outputs.version }}.jar
          asset_content_type: application/java-archive