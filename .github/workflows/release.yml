name: Release

on:
  push:
    branches:
      - 'Mxtress'  # or your main dev branch

jobs:
  build:
    name: Build project and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run Spigot-BuildTools
        run: |
            mkdir -p .spigot-buildtools
             cd .spigot-buildtools
             wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar -O BuildTools.jar
             java -jar BuildTools.jar --rev 1.21.5 --remapped
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean package
      - name: Get Version from POM
        run: echo "::set-output name=version::$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec)"
        id: version
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}
      - name: Bump patch version
        id: bump_version
        run: |
          version="${{ steps.get_tag.outputs.tag }}"
          version="${version#v}"  # Remove leading 'v' safely
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_tag="v$major.$minor.$patch"
          echo "Bumped to $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          echo "Latest tag: $latest_tag"
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT
      - name: Upload release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          files: target/*.jar
