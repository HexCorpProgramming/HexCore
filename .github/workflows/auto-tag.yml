name: Auto Tag

on:
  push:
    branches:
      - 'Mxtress'  # or your main dev branch

jobs:
  tag:
    name: Auto-increment and push tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to fetch all tags

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag and bump version
        id: tagger
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"

          version=$(echo "$latest_tag" | sed 's/^v//' )
          IFS='.' read -r major minor patch <<< "$version"

          # Bump patch version
          patch=$((patch + 1))
          new_tag="v$major.$minor.$patch"

          echo "New tag: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          PAT: ${{ github.token }}
        run: |
          git tag ${{ steps.tagger.outputs.tag }}
          git push origin ${{ steps.tagger.outputs.tag }}